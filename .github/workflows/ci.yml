name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: agrishield_testing
          POSTGRES_USER: agrishield
          POSTGRES_PASSWORD: agrishield
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agrishield -d agrishield_testing"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      APP_ENV: testing
      DB_TEST_HOST: 127.0.0.1
      DB_TEST_PORT: 5432
      DB_TEST_DATABASE: agrishield_testing
      DB_TEST_USERNAME: agrishield
      DB_TEST_PASSWORD: agrishield

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, pdo_pgsql
          coverage: none
          tools: composer:v2

      - name: Validate Composer configuration
        run: composer validate --strict

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Check code style
        run: vendor/bin/pint --test

      - name: Run static analysis
        run: composer analyse

      - name: Run test suite
        run: composer test

      - name: Audit dependencies
        run: composer audit
