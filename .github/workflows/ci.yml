name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgis/postgis:16-3.4-alpine
        env:
          POSTGRES_DB: agrishield_testing
          POSTGRES_USER: agrishield
          POSTGRES_PASSWORD: agrishield
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agrishield -d agrishield_testing"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      APP_ENV: testing
      DB_TEST_HOST: 127.0.0.1
      DB_TEST_PORT: 5432
      DB_TEST_DATABASE: agrishield_testing
      DB_TEST_USERNAME: agrishield
      DB_TEST_PASSWORD: agrishield
      REQUIRE_POSTGIS: 'true'

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, pdo_pgsql, gd, imagick
          coverage: none
          tools: composer:v2

      - name: Validate Composer configuration
        run: composer validate --strict

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Check code style
        run: vendor/bin/pint --test

      - name: Run static analysis
        run: composer analyse

      - name: Run test suite
        run: composer test

      - name: Audit dependencies
        run: composer audit

  clients:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Install web dependencies
        run: npm ci

      - name: Build web assets
        run: npm run build

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.3'
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        working-directory: mobile_flutter
        run: flutter pub get

      - name: Analyze Flutter
        working-directory: mobile_flutter
        run: flutter analyze

      - name: Test Flutter
        working-directory: mobile_flutter
        run: flutter test

      - name: Compile Android application
        working-directory: mobile_flutter
        run: flutter build apk --debug
